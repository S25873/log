<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>조판 · 로그 이미지 생성기</title>
<meta name="description" content="대사와 지문을 조판해 이미지로 저장하는 도구">
<!-- 웹폰트: 캔버스에 실제로 쓰이는 서체들 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css');
  @import url('https://fonts.googleapis.com/earlyaccess/nanummyeongjo.css');
  @import url('https://cdn.jsdelivr.net/gh/MonadABXY/mona-font/web/mona.css');
  @font-face{font-family:'Paperozi';font-weight:400;font-display:swap;src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-4Regular.woff2') format('woff2');}
  @font-face{font-family:'Paperozi';font-weight:700;font-display:swap;src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-7Bold.woff2') format('woff2');}
  @font-face{font-family:'GMarketSans';font-weight:300;font-display:swap;src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/GmarketSansLight.woff') format('woff');}
  @font-face{font-family:'GMarketSans';font-weight:500;font-display:swap;src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/GmarketSansMedium.woff') format('woff');}
  @font-face{font-family:'GMarketSans';font-weight:700;font-display:swap;src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/GmarketSansBold.woff') format('woff');}
  @font-face{font-family:'Ridibatang';font-weight:normal;font-display:swap;src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_twelve@1.0/RIDIBatang.woff') format('woff');}
  @font-face{font-family:'PfStardust';font-weight:normal;font-display:swap;src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/PFStardust.woff') format('woff');}
  @font-face{font-family:'Presentation';font-weight:300;font-display:swap;src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2404@1.0/Freesentation-3Light.woff2') format('woff2');}
  @font-face{font-family:'Presentation';font-weight:400;font-display:swap;src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2404@1.0/Freesentation-4Regular.woff2') format('woff2');}
  @font-face{font-family:'Presentation';font-weight:600;font-display:swap;src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2404@1.0/Freesentation-6SemiBold.woff2') format('woff2');}
  @font-face{font-family:'Presentation';font-weight:700;font-display:swap;src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2404@1.0/Freesentation-7Bold.woff2') format('woff2');}

  /* ============================================================
     디자인 토큰 — 종이와 잉크
     라이트: 차가운 기가 없는 웜 페이퍼 화이트 위에 잉크 그레이.
     다크:   자정의 서재. 순검정이 아니라 살짝 온기 있는 목탄색.
     액센트: 채도 낮은 청록(teal) 하나만. 절제해서 쓴다.
     ============================================================ */
  :root{
    --font-ui:"Pretendard",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;

    /* 액센트 (라이트/다크 공통 계열, 밝기만 조정) */
    --accent:#2f7a72;
    --accent-press:#276660;
    --accent-soft:#e7f1ef;
    --accent-ink:#1f5049;

    /* 표면 */
    --bg:#f6f5f2;          /* 앱 바탕 */
    --surface:#fffdfb;     /* 패널 */
    --surface-2:#f1efeb;   /* 인셋/입력 바탕 */
    --surface-3:#e9e6e0;   /* 더 깊은 인셋 */

    /* 선 */
    --line:#e4e0d9;
    --line-strong:#d3cec5;

    /* 글자 */
    --ink:#26241f;         /* 본문 */
    --ink-2:#5b5850;       /* 보조 */
    --ink-3:#918d83;       /* 흐린 라벨 */
    --ink-on-accent:#ffffff;

    /* 상태 */
    --danger:#b0504a;
    --danger-soft:#f7e9e7;

    /* 그림자 (부드럽고 낮게) */
    --shadow-1:0 1px 2px rgba(40,36,30,.04),0 1px 3px rgba(40,36,30,.06);
    --shadow-2:0 4px 12px -6px rgba(40,36,30,.18);
    --shadow-pop:0 12px 32px -12px rgba(40,36,30,.28);
    --shadow-canvas:0 18px 48px -28px rgba(40,36,30,.5);

    --radius-lg:16px;
    --radius:12px;
    --radius-sm:9px;
    --radius-xs:7px;

    --tap:44px;            /* 최소 터치 타깃 */

    --header-h:56px;
    --dock-h:calc(64px + env(safe-area-inset-bottom));
  }
  :root[data-theme="dark"]{
    --accent:#59b3a8;
    --accent-press:#6cc2b7;
    --accent-soft:#1c2f2c;
    --accent-ink:#8fd3c9;

    --bg:#16150f;
    --surface:#211f18;
    --surface-2:#2a2820;
    --surface-3:#332f26;

    --line:#332f26;
    --line-strong:#413d31;

    --ink:#eae6dc;
    --ink-2:#b4afa2;
    --ink-3:#84806f;
    --ink-on-accent:#0f1513;

    --danger:#d98b83;
    --danger-soft:#3a221f;

    --shadow-1:0 1px 2px rgba(0,0,0,.3);
    --shadow-2:0 6px 16px -8px rgba(0,0,0,.55);
    --shadow-pop:0 16px 40px -14px rgba(0,0,0,.7);
    --shadow-canvas:0 22px 56px -28px rgba(0,0,0,.75);
  }

  *,*::before,*::after{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{
    font-family:var(--font-ui);
    background:var(--bg);
    color:var(--ink);
    line-height:1.5;
    -webkit-text-size-adjust:100%;
    text-size-adjust:100%;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:none;
  }
  button{font-family:inherit;}
  ::selection{background:var(--accent-soft);color:var(--accent-ink);}

  /* 포커스: 키보드 사용자에게만 또렷하게 */
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px;}

  /* ============================================================
     앱 셸 레이아웃
     PC: 좌측 편집 패널(고정폭) + 우측 프리뷰(가변) 2단.
     모바일: 상단 헤더 + 스크롤 본문 + 하단 고정 저장 독.
     ============================================================ */
  .app{
    display:grid;
    grid-template-rows:var(--header-h) 1fr;
    height:100dvh;
  }

  /* ---- 헤더 ---- */
  .topbar{
    display:flex;align-items:center;gap:12px;
    padding:0 16px;
    border-bottom:1px solid var(--line);
    background:color-mix(in srgb, var(--surface) 88%, transparent);
    backdrop-filter:saturate(1.4) blur(12px);
    -webkit-backdrop-filter:saturate(1.4) blur(12px);
    position:sticky;top:0;z-index:40;
  }
  .brand{display:flex;align-items:center;gap:10px;min-width:0;}
  .brand__mark{
    width:28px;height:28px;flex:none;border-radius:8px;
    background:var(--ink);color:var(--bg);
    display:grid;place-items:center;
    font-weight:700;font-size:15px;letter-spacing:-.03em;
  }
  .brand__name{font-weight:700;font-size:15px;letter-spacing:-.02em;white-space:nowrap;}
  .brand__name small{color:var(--ink-3);font-weight:500;margin-left:6px;}
  .topbar__spacer{flex:1;}
  .icon-btn{
    width:var(--tap);height:var(--tap);flex:none;
    border:1px solid var(--line);background:var(--surface);
    border-radius:var(--radius-sm);color:var(--ink-2);
    display:grid;place-items:center;cursor:pointer;
    transition:background .15s,color .15s,border-color .15s;
  }
  .icon-btn:hover{background:var(--surface-2);color:var(--ink);}
  .icon-btn:active{transform:translateY(1px);}
  .icon-btn svg{width:20px;height:20px;}

  /* ---- 본문 그리드 ---- */
  .workspace{
    display:grid;
    grid-template-columns:minmax(360px,420px) 1fr;
    min-height:0;
    overflow:hidden;
  }

  /* 편집 열 */
  .editcol{
    display:flex;flex-direction:column;min-height:0;min-width:0;
    border-right:1px solid var(--line);
    background:var(--surface);
  }
  .tabbar{
    display:flex;gap:2px;padding:10px 12px 0;
    border-bottom:1px solid var(--line);
    flex:none;
  }
  .tab{
    appearance:none;border:none;background:transparent;cursor:pointer;
    padding:10px 14px 12px;font-size:13.5px;font-weight:600;
    color:var(--ink-3);position:relative;border-radius:8px 8px 0 0;
    transition:color .15s;
  }
  .tab:hover{color:var(--ink-2);}
  .tab[aria-selected="true"]{color:var(--ink);}
  .tab[aria-selected="true"]::after{
    content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:2px;
    background:var(--accent);border-radius:2px;
  }
  .panelscroll{
    flex:1;min-height:0;overflow-y:auto;
    padding:16px 16px 24px;
    -webkit-overflow-scrolling:touch;
  }
  .panel{display:none;}
  .panel.is-active{display:block;animation:fade .18s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}

  /* 프리뷰 열 */
  .previewcol{
    display:flex;flex-direction:column;min-width:0;min-height:0;
    background:
      radial-gradient(120% 80% at 50% 0%, color-mix(in srgb,var(--surface) 40%, transparent), transparent 70%),
      var(--bg);
  }
  .preview__bar{
    display:flex;align-items:center;gap:10px;
    padding:12px 20px;flex:none;
  }
  .preview__label{
    font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    color:var(--ink-3);
  }
  .preview__meta{
    margin-left:auto;font-size:11.5px;color:var(--ink-3);
    font-variant-numeric:tabular-nums;
  }
  .preview__scroll{
    flex:1;min-height:0;overflow:auto;
    display:flex;align-items:flex-start;justify-content:center;
    padding:8px 24px 32px;
  }
  #stage{width:100%;max-width:640px;overflow:hidden;}
  #stage-in{transform-origin:top left;width:1200px;}

  /* 데스크톱 저장 바 (프리뷰 하단) */
  .savebar{
    display:flex;gap:10px;padding:14px 20px;flex:none;
    border-top:1px solid var(--line);
    background:color-mix(in srgb,var(--surface) 70%, transparent);
  }

  /* ============================================================
     공용 컨트롤
     ============================================================ */
  .field{display:flex;flex-direction:column;min-width:0;}
  .field + .field{margin-top:16px;}
  .label{
    display:flex;align-items:baseline;gap:8px;
    font-size:11.5px;font-weight:600;color:var(--ink-3);
    margin:0 0 7px;
  }
  .label .val{margin-left:auto;color:var(--accent);font-weight:700;font-variant-numeric:tabular-nums;}
  .label-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 8px;}
  .label-row .label{margin:0;}

  input[type=text],select,textarea{
    width:100%;height:40px;
    background:var(--surface-2);border:1px solid var(--line);color:var(--ink);
    border-radius:var(--radius-sm);padding:0 12px;
    font-size:13.5px;font-family:inherit;
    transition:border-color .15s,background .15s;
  }
  select{cursor:pointer;
    appearance:none;-webkit-appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 16 16' fill='none' stroke='%23918d83' stroke-width='1.6'><path d='M4 6l4 4 4-4'/></svg>");
    background-repeat:no-repeat;background-position:right 11px center;
    padding-right:32px;
  }
  input[type=text]:focus,select:focus,textarea:focus{border-color:var(--accent);background:var(--surface);}
  textarea{height:auto;padding:10px 12px;line-height:1.6;resize:vertical;}

  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .divider{height:1px;background:var(--line);margin:18px 0;border:0;}

  /* 카드형 패널 섹션 */
  .card{
    background:var(--surface-2);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px;
  }
  .card + .card{margin-top:14px;}
  .card__title{
    font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
    color:var(--ink-3);margin:0 0 12px;
  }

  /* 세그먼트 토글 */
  .seg{
    display:flex;gap:3px;padding:3px;height:40px;
    background:var(--surface-3);border:1px solid var(--line);border-radius:var(--radius-sm);
  }
  .seg button{
    flex:1;min-width:0;border:none;background:transparent;cursor:pointer;
    border-radius:var(--radius-xs);font-size:12.5px;font-weight:600;color:var(--ink-2);
    transition:background .15s,color .15s,box-shadow .15s;
  }
  .seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-1);}

  /* 미니 버튼(도구줄) */
  .mini-row{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end;}
  .mini{
    border:1px solid var(--line);background:var(--surface);color:var(--ink-2);
    border-radius:var(--radius-xs);padding:6px 9px;font-size:11px;font-weight:600;
    cursor:pointer;white-space:nowrap;transition:background .12s,color .12s,border-color .12s;
  }
  .mini:hover{background:var(--accent-soft);color:var(--accent-ink);border-color:transparent;}
  .mini:active{transform:translateY(1px);}
  .mini.is-danger:hover{background:var(--danger-soft);color:var(--danger);}

  /* 큰 버튼 */
  .btn{
    flex:1;height:48px;border:none;border-radius:var(--radius);cursor:pointer;
    font-size:14px;font-weight:700;letter-spacing:-.01em;
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    transition:filter .15s,transform .1s,background .15s;
  }
  .btn--primary{background:var(--accent);color:var(--ink-on-accent);box-shadow:var(--shadow-2);}
  .btn--primary:hover{filter:brightness(1.05);}
  .btn--primary:active{transform:translateY(1px);}
  .btn--ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line-strong);}
  .btn--ghost:hover{background:var(--surface-2);}
  .btn[disabled]{opacity:.55;cursor:default;pointer-events:none;}
  .btn svg{width:18px;height:18px;}

  /* 토글 스위치 */
  .switch{
    display:flex;align-items:center;gap:12px;cursor:pointer;user-select:none;
    background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius-sm);
    padding:12px 14px;
  }
  .switch input{
    appearance:none;-webkit-appearance:none;width:42px;height:24px;flex:none;
    border-radius:999px;background:var(--surface-3);position:relative;cursor:pointer;
    transition:background .18s;margin:0;border:1px solid var(--line);
  }
  .switch input::after{
    content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;
    background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .18s;
  }
  .switch input:checked{background:var(--accent);border-color:transparent;}
  .switch input:checked::after{transform:translateX(18px);}
  .switch__text{display:flex;flex-direction:column;gap:1px;}
  .switch__title{font-size:13px;font-weight:600;color:var(--ink);}
  .switch__sub{font-size:11px;color:var(--ink-3);}

  /* 슬라이더 */
  .rangewrap{display:flex;align-items:center;gap:12px;}
  input[type=range]{
    flex:1;height:24px;accent-color:var(--accent);cursor:pointer;
  }

  /* ============================================================
     서식 도구 (에디터 아래)
     ============================================================ */
  .fmt{display:flex;flex-direction:column;gap:6px;margin-top:10px;}
  .fmt-row{display:flex;gap:6px;}
  .fbtn{
    flex:1 1 0;min-width:0;height:38px;border-radius:var(--radius-xs);
    border:1px solid var(--line);background:var(--surface);color:var(--ink);
    cursor:pointer;font-size:13px;display:grid;place-items:center;
    transition:background .12s,border-color .12s,color .12s;
  }
  .fbtn:hover{background:var(--surface-2);}
  .fbtn:active{transform:translateY(1px);}
  .fbtn.is-active{background:var(--accent);border-color:transparent;color:var(--ink-on-accent);}
  .fbtn b{font-weight:700;}
  .fbtn i{font-style:italic;}
  .fbtn .u{text-decoration:underline;text-underline-offset:2px;}
  .fbtn s{text-decoration:line-through;}
  .fbtn .hl-ic{background:var(--accent-soft);color:var(--accent-ink);padding:2px 5px;border-radius:4px;font-size:11px;font-weight:700;}
  .fbtn.is-active .hl-ic{background:rgba(255,255,255,.25);color:#fff;}
  .fbtn .em-ic{color:var(--accent);font-size:11px;font-weight:700;}
  .fbtn.is-active .em-ic{color:#fff;}
  .fbtn .lbl{font-size:12px;font-weight:600;}

  /* 말풍선/제목 아이콘 */
  .bub-ic{position:relative;display:inline-block;width:18px;height:12px;border-radius:6px;}
  .bub-ic>svg{position:absolute;bottom:0;width:11px;height:7px;overflow:visible;}
  .bub-ic--recv{background:#c7c6cc;}
  .bub-ic--send{background:var(--accent);}
  .bub-ic--recv>svg{left:-3px;}
  .bub-ic--send>svg{right:-3px;transform:scaleX(-1);}
  .bub-ic--recv>svg path{fill:#c7c6cc;}
  .bub-ic--send>svg path{fill:var(--accent);}
  .fbtn.is-active .bub-ic{background:#fff !important;}
  .fbtn.is-active .bub-ic>svg path{fill:#fff !important;}

  /* 팝오버 */
  .pop-wrap{position:relative;flex:1 1 0;min-width:0;display:flex;}
  .pop-wrap>.fbtn{flex:1 1 0;width:100%;}
  .pop{
    position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);
    z-index:30;background:var(--surface);border:1px solid var(--line);
    border-radius:var(--radius);box-shadow:var(--shadow-pop);
    padding:5px;display:none;flex-direction:column;gap:3px;min-width:170px;
  }
  .pop.is-open{display:flex;}
  .pop button{
    display:flex;align-items:center;gap:9px;width:100%;text-align:left;
    border:none;background:transparent;cursor:pointer;border-radius:var(--radius-xs);
    padding:9px 10px;font-size:12px;font-weight:600;color:var(--ink);white-space:nowrap;
  }
  .pop button:hover{background:var(--accent-soft);color:var(--accent-ink);}
  .pop .pk-ic{position:relative;width:20px;height:13px;border-radius:6.5px;flex:none;}
  .pop .pk-ic>svg{position:absolute;bottom:0;width:12px;height:8px;overflow:visible;}
  .pop .pk-recv{background:#c7c6cc;}.pop .pk-send{background:var(--accent);}
  .pop .pk-recv>svg{left:-3px;}.pop .pk-send>svg{right:-3px;transform:scaleX(-1);}
  .pop .pk-recv>svg path{fill:#c7c6cc;}.pop .pk-send>svg path{fill:var(--accent);}

  /* 저수준 도구줄 (제목/말풍선 나가기·삭제) */
  .lowtools{display:flex;gap:6px;margin-top:6px;}
  .lowtools[hidden]{display:none;}
  .subtools{display:grid;grid-template-columns:1fr 1fr;gap:6px;flex:1;}
  .subtools[hidden]{display:none;}
  .fbtn--exit{background:var(--accent-soft);border-color:transparent;color:var(--accent-ink);font-size:12px;font-weight:700;}
  .fbtn--exit:hover{background:var(--accent);color:var(--ink-on-accent);}
  .fbtn--del{font-size:12px;font-weight:700;color:var(--ink-2);}
  .fbtn--del:hover{background:var(--danger-soft);border-color:transparent;color:var(--danger);}
  .fbtn--exit[hidden],.fbtn--del[hidden]{display:none;}

  /* ============================================================
     색상 그리드
     ============================================================ */
  .cgrid{display:grid;gap:12px;}
  .cgrid--6{grid-template-columns:repeat(6,minmax(0,1fr));}
  .cgrid--5{grid-template-columns:repeat(5,minmax(0,1fr));}
  .cchip>label{
    display:block;font-size:10.5px;color:var(--ink-3);font-weight:600;margin:0 0 6px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .cchip input[type=color]{
    width:100%;height:38px;padding:3px;border-radius:var(--radius-xs);
    border:1px solid var(--line);background:var(--surface);cursor:pointer;
    -webkit-appearance:none;appearance:none;
  }
  .cchip input[type=color]::-webkit-color-swatch-wrapper{padding:0;}
  .cchip input[type=color]::-webkit-color-swatch{border:none;border-radius:5px;}
  .cchip input[type=color]::-moz-color-swatch{border:none;border-radius:5px;}
  .cchip input[type=text]{position:absolute;width:1px;height:1px;padding:0;margin:-1px;
    border:0;clip:rect(0 0 0 0);clip-path:inset(50%);overflow:hidden;white-space:nowrap;}

  /* 프리셋 칩 */
  .presets{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:7px;}
  .chip{
    position:relative;width:100%;height:36px;min-width:0;
    border:1px solid var(--line);border-radius:var(--radius-xs);cursor:pointer;
    overflow:hidden;padding:0;display:grid;place-items:center;
    font-size:14px;font-weight:700;
    box-shadow:var(--shadow-1);transition:transform .12s,box-shadow .12s;
    text-shadow:0 1px 2px rgba(0,0,0,.12);
  }
  .chip:hover{transform:translateY(-2px);box-shadow:var(--shadow-2);}
  .chip:active{transform:translateY(0);}
  .chip.on{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--accent);}

  .dots{display:flex;flex-wrap:wrap;gap:8px;}
  .dot{
    width:32px;height:32px;flex:none;border-radius:50%;
    border:1px solid var(--line);background:var(--surface);cursor:pointer;padding:0;
    display:grid;place-items:center;transition:transform .12s,box-shadow .12s;
  }
  .dot i{width:18px;height:18px;border-radius:50%;display:block;}
  .dot:hover{transform:translateY(-1px);}
  .dot.on{box-shadow:0 0 0 2px var(--accent);border-color:transparent;}

  /* 내 프리셋 칩 */
  .mychips{display:flex;flex-wrap:wrap;gap:7px;margin-top:4px;}
  .mychip{
    display:inline-flex;align-items:center;gap:6px;
    background:var(--surface);border:1px solid var(--line);border-radius:999px;
    padding:6px 7px 6px 12px;font-size:12px;font-weight:600;color:var(--ink);cursor:pointer;
    transition:border-color .12s,background .12s;
  }
  .mychip:hover{border-color:var(--accent);background:var(--accent-soft);}
  .mychip__x{
    width:17px;height:17px;border-radius:50%;background:var(--surface-3);color:var(--ink-3);
    display:grid;place-items:center;font-size:13px;line-height:1;flex:none;
  }
  .mychip__x:hover{background:var(--danger);color:#fff;}
  .mychips__empty{font-size:11.5px;color:var(--ink-3);padding:2px 0;}

  .photo-controls{margin-top:14px;}
  .photo-controls[hidden]{display:none;}

  /* ============================================================
     로그 에디터 (contenteditable)
     ============================================================ */
  #editor{
    width:100%;min-height:220px;max-height:44vh;overflow-y:auto;
    background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius-sm);
    color:var(--ink);padding:12px 14px;
    font-size:13px;line-height:1.75;
    white-space:pre-wrap;overflow-wrap:break-word;
    -webkit-overflow-scrolling:touch;
  }
  #editor:focus{border-color:var(--accent);background:var(--surface);outline:none;}
  #editor:empty:before{content:attr(data-placeholder);color:var(--ink-3);}
  #editor *{font-size:inherit !important;line-height:inherit !important;color:inherit;display:inline;}
  #editor div,#editor p{display:block !important;min-height:1.2em;}
  #editor mark.hl{color:inherit;background:var(--hl,#f5edbe);padding:0;
    -webkit-box-decoration-break:clone;box-decoration-break:clone;}
  #editor mark.em{color:var(--em,inherit) !important;background:transparent;}
  #editor mark.ul{background:transparent;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:2px;}
  #editor mark.sub{color:var(--sub-color,#8a8a8a) !important;background:transparent;font-size:.8em !important;}
  #editor .g-title-blk{display:block;margin:0 0 6px;}
  #editor .g-title-main{display:block !important;font-size:1.6em !important;font-weight:700 !important;line-height:1.25 !important;}
  #editor .g-title-sub{display:block !important;font-size:1.15em !important;font-weight:400 !important;margin-top:2px;line-height:1.3 !important;}
  #editor .g-title-main:empty:before{content:"제목";color:var(--ink-3);}
  #editor .g-title-sub:empty:before{content:"소제목";color:var(--ink-3);}
  #editor .g-quote{display:block;white-space:pre-wrap;}
  #editor .g-quote.left{border-left:2px solid var(--line-strong);padding-left:8px;}
  #editor .g-quote.right{border-right:2px solid var(--line-strong);padding-right:8px;text-align:right;}
  #editor .g-hr{display:flex;align-items:center;justify-content:center;margin:6px 0;height:1.2em;line-height:1;color:transparent;}
  #editor .g-hr.line:before{content:"";display:block;width:100%;height:1px;background:var(--line-strong);}
  #editor .g-hr.dots{letter-spacing:.4em;color:var(--ink-3);height:auto;}
  #editor .g-hr.short:before{content:"";display:block;width:40px;height:1px;background:var(--ink-3);}
  #editor .g-bub{display:block;position:relative;width:fit-content;max-width:80%;padding:4px 10px;border-radius:14px;margin:2px 0;white-space:pre-wrap;}
  #editor .g-bub.recv{margin-right:auto;margin-left:8px;background:var(--bub-recv,#e5e5ea);color:var(--bub-recv-ink,#000) !important;}
  #editor .g-bub.send{margin-left:auto;margin-right:8px;background:var(--bub-send,#248bf5);color:var(--bub-send-ink,#fff) !important;}
  #editor .g-bub.recv *{color:var(--bub-recv-ink,#000) !important;}
  #editor .g-bub.send *{color:var(--bub-send-ink,#fff) !important;}
  #editor .g-bub mark.em{color:var(--em,inherit) !important;}
  #editor .g-bub>svg.g-tail{position:absolute;bottom:0;width:16px;height:10px;z-index:0;overflow:visible;pointer-events:none;}
  #editor .g-bub.recv>svg.g-tail{left:-5px;}
  #editor .g-bub.send>svg.g-tail{right:-5px;transform:scaleX(-1);}
  #editor .g-bub.recv>svg.g-tail path{fill:var(--bub-recv,#e5e5ea);}
  #editor .g-bub.send>svg.g-tail path{fill:var(--bub-send,#248bf5);}
  #editor .g-bub.is-empty:before{content:"내용";opacity:.6;}
  #editor .g-bub.recv.is-empty:before{color:var(--bub-recv-ink,#000);}
  #editor .g-bub.send.is-empty:before{color:var(--bub-send-ink,#fff);}
  #editor .g-bub-name{display:block;width:fit-content;max-width:80%;font-size:.8em;font-weight:700;color:var(--ink-3);margin:4px 0;padding:0 3px;white-space:pre-wrap;}
  #editor .g-bub-name.recv{margin-right:auto;margin-left:8px;text-align:left;color:var(--bub-name-recv,#8a8a8a);}
  #editor .g-bub-name.send{margin-left:auto;margin-right:8px;text-align:right;color:var(--bub-name-send,#8a8a8a);}
  #editor .g-bub-name:empty:before{content:"이름";color:var(--ink-3);opacity:.7;}

  #name-ed{
    width:100%;min-height:40px;max-height:120px;overflow-y:auto;
    background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius-sm);
    color:var(--ink);padding:9px 12px;font-size:13.5px;line-height:1.6;
    white-space:pre-wrap;overflow-wrap:break-word;
  }
  #name-ed:focus{border-color:var(--accent);background:var(--surface);outline:none;}
  #name-ed:empty:before{content:attr(data-placeholder);color:var(--ink-3);}
  #name-ed *{font-size:inherit !important;line-height:inherit !important;color:inherit;display:inline;}
  #name-ed div,#name-ed p{display:block !important;min-height:1.2em;}

  /* ============================================================
     캔버스 (저장 대상)
     ============================================================ */
  #canvas,.canvas-clone{
    background:#fff;color:#3a3a3a;width:1200px;position:relative;
    white-space:pre-wrap;overflow-wrap:break-word;
    border-radius:4px;box-shadow:var(--shadow-canvas);
    -webkit-text-size-adjust:100%;text-size-adjust:100%;
  }
  #canvas *,.canvas-clone *{margin:0;padding:0;background:transparent;}
  #canvas .g-inner,.canvas-clone .g-inner{position:relative;z-index:1;}
  #canvas .g-bg-layer,.canvas-clone .g-bg-layer{position:absolute;inset:0;background-size:cover;background-position:center;pointer-events:none;z-index:0;}
  #canvas mark.hl,.canvas-clone mark.hl{color:inherit !important;text-decoration:none !important;display:inline !important;
    background:var(--hl-solid,#f6efcf) !important;padding:0 !important;
    -webkit-box-decoration-break:clone;box-decoration-break:clone;}
  #canvas mark.em,.canvas-clone mark.em{color:var(--em) !important;background:transparent !important;display:inline !important;}
  #canvas mark.ul,.canvas-clone mark.ul{color:inherit !important;background:transparent !important;display:inline !important;
    text-decoration:underline !important;text-decoration-thickness:.05em !important;text-underline-offset:.12em !important;}
  #canvas mark.sub,.canvas-clone mark.sub{color:var(--sub-color,#8a8a8a) !important;background:transparent !important;display:inline !important;font-size:.8em !important;}
  #canvas .g-title-blk,.canvas-clone .g-title-blk{display:block !important;margin:0 0 .6em !important;}
  #canvas .g-title-main,.canvas-clone .g-title-main{display:block !important;font-size:1.6em !important;font-weight:700 !important;color:var(--title-color,inherit) !important;line-height:1.25 !important;white-space:pre-wrap !important;overflow-wrap:break-word !important;}
  #canvas .g-title-sub,.canvas-clone .g-title-sub{display:block !important;font-size:1.15em !important;font-weight:400 !important;color:var(--subtitle-color,inherit) !important;margin-top:.25em !important;line-height:1.3 !important;white-space:pre-wrap !important;overflow-wrap:break-word !important;}
  #canvas .g-quote,.canvas-clone .g-quote{display:block !important;white-space:pre-wrap !important;overflow-wrap:break-word !important;}
  #canvas .g-quote.left,.canvas-clone .g-quote.left{border-left:.16em solid var(--quote-color,rgba(140,140,140,.55)) !important;padding-left:.6em !important;}
  #canvas .g-quote.right,.canvas-clone .g-quote.right{border-right:.16em solid var(--quote-color,rgba(140,140,140,.55)) !important;padding-right:.6em !important;text-align:right !important;}
  #canvas .g-hr,.canvas-clone .g-hr{display:flex !important;align-items:center !important;justify-content:center !important;margin:.7em 0 !important;height:1em !important;line-height:1 !important;color:transparent !important;overflow:visible !important;}
  #canvas .g-hr.line:before,.canvas-clone .g-hr.line:before{content:"" !important;display:block !important;width:100% !important;height:2px !important;background:var(--hr-color,rgba(140,140,140,.5)) !important;}
  #canvas .g-hr.dots,.canvas-clone .g-hr.dots{letter-spacing:.4em !important;font-size:.9em !important;height:auto !important;color:var(--hr-color,rgba(140,140,140,.55)) !important;}
  #canvas .g-hr.short:before,.canvas-clone .g-hr.short:before{content:"" !important;display:block !important;width:12% !important;height:2px !important;background:var(--hr-color,rgba(140,140,140,.6)) !important;}
  #canvas .g-name,.canvas-clone .g-name{display:block !important;margin-top:1.6em !important;font-weight:400 !important;color:var(--name-color,#5a5a5a) !important;white-space:pre-wrap !important;overflow-wrap:break-word !important;}
  #canvas .g-name.right,.canvas-clone .g-name.right{text-align:right !important;}
  #canvas .g-name.left,.canvas-clone .g-name.left{text-align:left !important;}
  #canvas .g-name.s-bold,.canvas-clone .g-name.s-bold{font-weight:700 !important;}
  #canvas .g-name.s-bar,.canvas-clone .g-name.s-bar{font-weight:400 !important;font-size:.85em !important;color:var(--name-color,rgba(90,90,90,.85)) !important;}
  #canvas .g-name.s-bar.left,.canvas-clone .g-name.s-bar.left{border-left:.16em solid var(--bar-color,rgba(140,140,140,.4)) !important;padding-left:.55em !important;}
  #canvas .g-name.s-bar.right,.canvas-clone .g-name.s-bar.right{border-right:.16em solid var(--bar-color,rgba(140,140,140,.4)) !important;padding-right:.55em !important;}
  #canvas .g-bub,.canvas-clone .g-bub{display:block !important;position:relative !important;max-width:75% !important;width:fit-content !important;margin:.12em 0 !important;padding:.5em .875em !important;border-radius:1.15em !important;text-align:left !important;white-space:pre-wrap !important;overflow-wrap:break-word !important;word-break:normal !important;line-height:1.25 !important;}
  #canvas .g-bub.cont + .g-bub,.canvas-clone .g-bub.cont + .g-bub,#canvas .g-bub + .g-bub.cont,.canvas-clone .g-bub + .g-bub.cont{margin-top:.1em !important;}
  #canvas .g-bub:first-child,.canvas-clone .g-bub:first-child{margin-top:0 !important;}
  #canvas .g-bub.recv,.canvas-clone .g-bub.recv{margin-right:auto !important;margin-left:.4em !important;background:var(--bub-recv,#e5e5ea) !important;color:var(--bub-recv-ink,#000) !important;}
  #canvas .g-bub.send,.canvas-clone .g-bub.send{margin-left:auto !important;margin-right:.4em !important;background:var(--bub-send,#248bf5) !important;color:var(--bub-send-ink,#fff) !important;}
  #canvas .g-bub-name,.canvas-clone .g-bub-name{display:block !important;width:fit-content !important;max-width:75% !important;font-size:.8em !important;font-weight:700 !important;line-height:1.2 !important;margin:.5em 0 .35em !important;padding:0 .3em !important;white-space:pre-wrap !important;overflow-wrap:break-word !important;}
  #canvas .g-bub-name.recv,.canvas-clone .g-bub-name.recv{margin-right:auto !important;margin-left:.4em !important;text-align:left !important;color:var(--bub-name-recv,#8a8a8a) !important;}
  #canvas .g-bub-name.send,.canvas-clone .g-bub-name.send{margin-left:auto !important;margin-right:.4em !important;text-align:right !important;color:var(--bub-name-send,#8a8a8a) !important;}
  #canvas .g-bub-name + .g-bub,.canvas-clone .g-bub-name + .g-bub{margin-top:.25em !important;}
  #canvas .g-bub-name:first-child,.canvas-clone .g-bub-name:first-child{margin-top:0 !important;}
  #canvas .g-bub>svg.g-tail,.canvas-clone .g-bub>svg.g-tail{position:absolute !important;bottom:0 !important;z-index:0 !important;width:1.35em !important;height:.85em !important;display:block !important;overflow:visible !important;pointer-events:none !important;}
  #canvas .g-bub.recv>svg.g-tail,.canvas-clone .g-bub.recv>svg.g-tail{left:-.42em !important;}
  #canvas .g-bub.send>svg.g-tail,.canvas-clone .g-bub.send>svg.g-tail{right:-.42em !important;transform:scaleX(-1) !important;}
  #canvas .g-bub.recv>svg.g-tail path,.canvas-clone .g-bub.recv>svg.g-tail path{fill:var(--bub-recv,#e5e5ea) !important;}
  #canvas .g-bub.send>svg.g-tail path,.canvas-clone .g-bub.send>svg.g-tail path{fill:var(--bub-send,#248bf5) !important;}
  #canvas .g-bub mark.em,.canvas-clone .g-bub mark.em{color:var(--em) !important;}

  /* ============================================================
     모바일 (≤900px): 단일 열 + 하단 저장 독
     ============================================================ */
  .dock{display:none;}
  @media (max-width:900px){
    .app{grid-template-rows:var(--header-h) 1fr;}
    .workspace{
      grid-template-columns:1fr;
      grid-template-rows:auto 1fr;
      overflow-y:auto;
      -webkit-overflow-scrolling:touch;
    }
    .editcol{border-right:none;order:2;}
    .previewcol{
      order:1;position:sticky;top:0;z-index:20;
      border-bottom:1px solid var(--line);
      background:color-mix(in srgb,var(--surface) 92%, transparent);
      backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
      max-height:46vh;
    }
    .preview__scroll{padding:6px 16px 14px;}
    #stage{max-width:none;}
    .savebar{display:none;} /* 데스크톱 저장바 숨기고 하단 독 사용 */
    .panelscroll{overflow-y:visible;padding-bottom:calc(var(--dock-h) + 16px);}

    /* 하단 고정 저장 독 */
    .dock{
      display:flex;gap:10px;
      position:fixed;left:0;right:0;bottom:0;z-index:50;
      padding:10px 14px calc(10px + env(safe-area-inset-bottom));
      background:color-mix(in srgb,var(--surface) 92%, transparent);
      backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
      border-top:1px solid var(--line);
    }
    .cgrid--6{grid-template-columns:repeat(3,minmax(0,1fr));}
    .cgrid--5{grid-template-columns:repeat(3,minmax(0,1fr));}
    #editor{max-height:none;min-height:180px;}
  }
  @media (max-width:420px){
    .brand__name small{display:none;}
    .fbtn{height:36px;font-size:12px;}
    .cgrid--6,.cgrid--5{grid-template-columns:repeat(2,minmax(0,1fr));}
    .preview__meta{display:none;}
  }

  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.001ms !important;transition-duration:.001ms !important;}
  }
</style>
</head>
<body>
<div class="app">
  <!-- ================= 헤더 ================= -->
  <header class="topbar">
    <div class="brand">
      <div class="brand__mark">組</div>
      <div class="brand__name">조판<small>로그 이미지 생성기</small></div>
    </div>
    <div class="topbar__spacer"></div>
    <button class="icon-btn" id="theme-toggle" type="button" title="라이트/다크 전환" aria-label="라이트/다크 전환">
      <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
    </button>
  </header>

  <!-- ================= 작업 영역 ================= -->
  <div class="workspace">
    <!-- 편집 열 -->
    <section class="editcol">
      <div class="tabbar" role="tablist">
        <button class="tab" role="tab" aria-selected="true" data-tab="content">내용</button>
        <button class="tab" role="tab" aria-selected="false" data-tab="design">디자인</button>
        <button class="tab" role="tab" aria-selected="false" data-tab="layout">레이아웃</button>
      </div>

      <div class="panelscroll">
        <!-- ---------- 내용 패널 ---------- -->
        <div class="panel is-active" data-panel="content" role="tabpanel">
          <div class="label-row">
            <span class="label">로그</span>
            <div class="mini-row">
              <button class="mini" id="t-star" type="button" title="별표(*) 모두 삭제">✱</button>
              <button class="mini" id="t-quote" type="button" title="휘어진 따옴표를 곧은 부호로">❝</button>
              <button class="mini" id="t-dots" type="button" title="마침표 세 개를 가로 생략부호로">⋯</button>
              <button class="mini" id="t-paren" type="button" title="괄호 안쪽을 이탤릭으로">( )</button>
              <button class="mini is-danger" id="t-clear" type="button">비우기</button>
              <button class="mini is-danger" id="t-reset" type="button">초기화</button>
            </div>
          </div>

          <div id="editor" contenteditable="true" role="textbox" spellcheck="false" translate="no"
               aria-label="로그 입력" data-placeholder="대사와 지문을 입력하세요."></div>

          <div class="fmt">
            <div class="fmt-row">
              <button class="fbtn" type="button" data-fmt="bold"><b>B</b></button>
              <button class="fbtn" type="button" data-fmt="italic"><i>I</i></button>
              <button class="fbtn" type="button" data-fmt="underline"><span class="u">U</span></button>
              <button class="fbtn" type="button" data-fmt="strike"><s>S</s></button>
              <button class="fbtn" type="button" data-fmt="emph"><span class="em-ic">강조</span></button>
              <button class="fbtn" type="button" data-fmt="hl"><span class="hl-ic">형광</span></button>
            </div>
            <div class="fmt-row">
              <span class="pop-wrap">
                <button class="fbtn" type="button" data-pop="title" title="제목"><span class="lbl">제목</span></button>
                <span class="pop">
                  <button type="button" data-fmt="title" data-sub="0">제목만</button>
                  <button type="button" data-fmt="title" data-sub="1">제목 + 소제목</button>
                </span>
              </span>
              <span class="pop-wrap">
                <button class="fbtn" type="button" data-fmt="sub"><span class="lbl">서브</span></button>
              </span>
              <span class="pop-wrap">
                <button class="fbtn" type="button" data-pop="quote" title="인용선"><span class="lbl">인용</span></button>
                <span class="pop">
                  <button type="button" data-fmt="quote" data-side="left">왼쪽 인용선</button>
                  <button type="button" data-fmt="quote" data-side="right">오른쪽 인용선</button>
                </span>
              </span>
              <span class="pop-wrap">
                <button class="fbtn" type="button" data-pop="hr" title="구분선"><span class="lbl">구분</span></button>
                <span class="pop">
                  <button type="button" data-fmt="hr" data-hr="line">구분선 ———</button>
                  <button type="button" data-fmt="hr" data-hr="dots">점 • • •</button>
                  <button type="button" data-fmt="hr" data-hr="short">짧은 중앙선</button>
                </span>
              </span>
              <span class="pop-wrap">
                <button class="fbtn" id="bub-recv-btn" type="button" data-fmt="bub-recv" title="말풍선 (왼쪽)"><span class="bub-ic bub-ic--recv"></span></button>
                <span class="pop">
                  <button type="button" data-kind="recv" data-tail="0"><span class="pk-ic pk-recv"></span>연속 (꼬리 없음)</button>
                  <button type="button" data-kind="recv" data-tail="0" data-name="1"><span class="pk-ic pk-recv"></span>이름 + 연속</button>
                  <button type="button" data-kind="recv" data-tail="1"><span class="pk-ic pk-recv"></span>마지막 (꼬리 있음)</button>
                  <button type="button" data-kind="recv" data-tail="1" data-name="1"><span class="pk-ic pk-recv"></span>이름 + 마지막</button>
                </span>
              </span>
              <span class="pop-wrap">
                <button class="fbtn" id="bub-send-btn" type="button" data-fmt="bub-send" title="말풍선 (오른쪽)"><span class="bub-ic bub-ic--send"></span></button>
                <span class="pop">
                  <button type="button" data-kind="send" data-tail="0"><span class="pk-ic pk-send"></span>연속 (꼬리 없음)</button>
                  <button type="button" data-kind="send" data-tail="0" data-name="1"><span class="pk-ic pk-send"></span>이름 + 연속</button>
                  <button type="button" data-kind="send" data-tail="1"><span class="pk-ic pk-send"></span>마지막 (꼬리 있음)</button>
                  <button type="button" data-kind="send" data-tail="1" data-name="1"><span class="pk-ic pk-send"></span>이름 + 마지막</button>
                </span>
              </span>
            </div>

            <div class="lowtools" hidden>
              <button class="fbtn fbtn--exit" id="title-exit" type="button" hidden>제목 나가기 ↵</button>
              <button class="fbtn fbtn--del" id="title-del" type="button" hidden>제목 삭제 ✕</button>
              <div class="subtools" hidden>
                <button class="fbtn fbtn--exit" id="bub-exit" type="button">말풍선 나가기 ↵</button>
                <button class="fbtn fbtn--del" id="bub-del" type="button">말풍선 삭제 ✕</button>
              </div>
            </div>
          </div>

          <div class="divider"></div>

          <div class="field">
            <span class="label">하단 정보</span>
            <div id="name-ed" contenteditable="true" role="textbox" spellcheck="false" translate="no"
                 aria-label="하단 정보 입력" data-placeholder="이름·날짜 등 (비워도 됩니다)"></div>
          </div>

          <div class="grid-2" style="margin-top:16px">
            <div class="field">
              <label class="label" for="name-pos">하단 배치</label>
              <select id="name-pos">
                <option value="plain-left" selected>기본 (좌)</option>
                <option value="plain-right">기본 (우)</option>
                <option value="bold-left">볼드 (좌)</option>
                <option value="bold-right">볼드 (우)</option>
                <option value="bar-left">인용선 (좌)</option>
                <option value="bar-right">인용선 (우)</option>
              </select>
            </div>
            <div class="field">
              <label class="label" for="font">글꼴</label>
              <select id="font">
                <option value='"Pretendard",sans-serif' selected>프리텐다드</option>
                <option value='"Paperozi",sans-serif'>페이퍼로지</option>
                <option value="'Presentation',sans-serif">프리젠테이션</option>
                <option value="'GMarketSans',sans-serif">G마켓 산스</option>
                <option value="'Nanum Myeongjo','나눔명조',serif">나눔명조</option>
                <option value='"Ridibatang",serif'>리디바탕</option>
                <option value="'Mona12','Mona12 Text KR',sans-serif">모나</option>
                <option value="'PfStardust',sans-serif">스타더스트</option>
              </select>
            </div>
          </div>

          <div class="divider"></div>

          <div class="label-row">
            <span class="label">내 프리셋</span>
            <button class="mini" id="preset-save" type="button">＋ 현재 설정 저장</button>
          </div>
          <div class="mychips" id="my-presets"></div>
        </div>

        <!-- ---------- 디자인 패널 ---------- -->
        <div class="panel" data-panel="design" role="tabpanel">
          <div class="card">
            <p class="card__title">기본 색</p>
            <div class="cgrid cgrid--6">
              <div class="cchip"><label>배경</label><input id="c-bg" type="color" value="#fbfaf7"><input id="c-bg-txt" type="text" value="#fbfaf7"></div>
              <div class="cchip"><label>글자</label><input id="c-fg" type="color" value="#2b2926"><input id="c-fg-txt" type="text" value="#2b2926"></div>
              <div class="cchip"><label>형광펜</label><input id="c-hl" type="color" value="#f2ecd0"><input id="c-hl-txt" type="text" value="#f2ecd0"></div>
              <div class="cchip"><label>강조색</label><input id="c-em" type="color" value="#b5654a"><input id="c-em-txt" type="text" value="#b5654a"></div>
              <div class="cchip"><label>제목</label><input id="c-title" type="color" value="#2b2926"><input id="c-title-txt" type="text" value="#2b2926"></div>
              <div class="cchip"><label>소제목</label><input id="c-subtitle" type="color" value="#2b2926"><input id="c-subtitle-txt" type="text" value="#2b2926"></div>
            </div>
          </div>

          <div class="card">
            <p class="card__title">보조 색</p>
            <div class="cgrid cgrid--5">
              <div class="cchip"><label>서브</label><input id="c-sub" type="color" value="#8a8a8a"><input id="c-sub-txt" type="text" value="#8a8a8a"></div>
              <div class="cchip"><label>인용 (본문)</label><input id="c-quote" type="color" value="#cfcabf"><input id="c-quote-txt" type="text" value="#cfcabf"></div>
              <div class="cchip"><label>구분 (본문)</label><input id="c-hr" type="color" value="#cfcabf"><input id="c-hr-txt" type="text" value="#cfcabf"></div>
              <div class="cchip"><label>글자 (하단)</label><input id="c-name" type="color" value="#6f6c64"><input id="c-name-txt" type="text" value="#6f6c64"></div>
              <div class="cchip"><label>인용 (하단)</label><input id="c-bar" type="color" value="#cfcabf"><input id="c-bar-txt" type="text" value="#cfcabf"></div>
            </div>
          </div>

          <div class="card">
            <p class="card__title">말풍선</p>
            <div class="cgrid cgrid--6">
              <div class="cchip"><label>왼쪽</label><input id="c-brecv" type="color" value="#e9e7e1"><input id="c-brecv-txt" type="text" value="#e9e7e1"></div>
              <div class="cchip"><label>오른쪽</label><input id="c-bsend" type="color" value="#2f7a72"><input id="c-bsend-txt" type="text" value="#2f7a72"></div>
              <div class="cchip"><label>글자(왼)</label><input id="c-brecv-ink" type="color" value="#2b2926"><input id="c-brecv-ink-txt" type="text" value="#2b2926"></div>
              <div class="cchip"><label>글자(오)</label><input id="c-bsend-ink" type="color" value="#ffffff"><input id="c-bsend-ink-txt" type="text" value="#ffffff"></div>
              <div class="cchip"><label>이름(왼)</label><input id="c-brecv-name" type="color" value="#8a8a8a"><input id="c-brecv-name-txt" type="text" value="#8a8a8a"></div>
              <div class="cchip"><label>이름(오)</label><input id="c-bsend-name" type="color" value="#8a8a8a"><input id="c-bsend-name-txt" type="text" value="#8a8a8a"></div>
            </div>
          </div>

          <div class="field" style="margin-top:16px">
            <span class="label">배경 프리셋</span>
            <div class="presets" id="bg-presets"></div>
          </div>
          <div class="field" style="margin-top:16px">
            <span class="label">형광펜 프리셋</span>
            <div class="dots" id="hl-presets"></div>
          </div>
          <div class="field" style="margin-top:16px">
            <span class="label">강조색 프리셋</span>
            <div class="dots" id="em-presets"></div>
          </div>

          <div class="divider"></div>

          <label class="switch" for="photo-on">
            <input id="photo-on" type="checkbox">
            <span class="switch__text">
              <span class="switch__title">사진 배경 사용</span>
              <span class="switch__sub">배경에 사진을 깔고 불투명도·밝기를 조절합니다</span>
            </span>
          </label>
          <input id="photo-file" type="file" accept="image/*" hidden>
          <div class="photo-controls" id="photo-controls" hidden>
            <div class="mini-row" style="justify-content:flex-start">
              <button class="mini" id="photo-pick" type="button">🖼 사진 선택</button>
            </div>
            <div class="grid-2" style="margin-top:14px">
              <div class="field">
                <span class="label">불투명도 <span class="val">100%</span></span>
                <div class="rangewrap"><input id="opacity" type="range" min="10" max="100" step="10" value="100"></div>
              </div>
              <div class="field">
                <span class="label">밝기 <span class="val">100%</span></span>
                <div class="rangewrap"><input id="bright" type="range" min="10" max="100" step="10" value="100"></div>
              </div>
            </div>
          </div>
        </div>

        <!-- ---------- 레이아웃 패널 ---------- -->
        <div class="panel" data-panel="layout" role="tabpanel">
          <div class="grid-2">
            <div class="field">
              <span class="label">여백 <span class="val">120px</span></span>
              <div class="rangewrap"><input id="pad" type="range" min="60" max="300" step="10" value="120"></div>
            </div>
            <div class="field">
              <span class="label">글자 크기 <span class="val">40px</span></span>
              <div class="rangewrap"><input id="font-size" type="range" min="20" max="50" value="40"></div>
            </div>
            <div class="field">
              <span class="label">자간 <span class="val">-0.5</span></span>
              <div class="rangewrap"><input id="letter-spacing" type="range" min="-2" max="2" step="0.1" value="-0.5"></div>
            </div>
            <div class="field">
              <span class="label">행간 <span class="val">1.7</span></span>
              <div class="rangewrap"><input id="line-height" type="range" min="10" max="20" step="1" value="17"></div>
            </div>
          </div>

          <div class="divider"></div>

          <div class="grid-2">
            <div class="field">
              <span class="label">정렬</span>
              <div class="seg" id="align-seg">
                <button type="button" data-align="left" aria-pressed="false">좌</button>
                <button type="button" data-align="justify" aria-pressed="true">양</button>
                <button type="button" data-align="center" aria-pressed="false">중</button>
                <button type="button" data-align="right" aria-pressed="false">우</button>
              </div>
            </div>
            <div class="field">
              <label class="label" for="break-mode">줄바꿈 기준</label>
              <select id="break-mode">
                <option value="word">단어 단위</option>
                <option value="char" selected>글자 단위</option>
              </select>
            </div>
          </div>

          <div class="divider"></div>

          <div class="field">
            <span class="label">크기 모드</span>
            <div class="seg" id="size-seg">
              <button type="button" data-mode="width" aria-pressed="true">폭 직접</button>
              <button type="button" data-mode="ratio" aria-pressed="false">비율 고정</button>
            </div>
          </div>

          <div class="field" id="width-row" style="margin-top:16px">
            <span class="label">저장 폭 <span class="val">1200px</span></span>
            <div class="rangewrap"><input id="base-w" type="range" min="600" max="2000" step="20" value="1200"></div>
          </div>

          <div id="ratio-row" style="display:none;margin-top:16px">
            <div class="field">
              <span class="label">비율</span>
              <div class="seg" id="ratio-seg"></div>
            </div>
            <div class="field" style="margin-top:16px">
              <span class="label">고정 폭 <span class="val">1080px</span></span>
              <div class="rangewrap"><input id="ratio-w" type="range" min="600" max="2000" step="20" value="1080"></div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- 프리뷰 열 -->
    <section class="previewcol">
      <div class="preview__bar">
        <span class="preview__label">미리보기</span>
        <span class="preview__meta" id="preview-meta">1200 px</span>
      </div>
      <div class="preview__scroll">
        <div id="stage"><div id="stage-in"><div id="canvas"></div></div></div>
      </div>
      <div class="savebar">
        <button class="btn btn--primary" id="save-png" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg>
          PNG로 저장
        </button>
        <button class="btn btn--ghost" id="save-jpg" type="button">JPG로 저장</button>
      </div>
    </section>
  </div>
</div>

<!-- 모바일 하단 저장 독 -->
<div class="dock">
  <button class="btn btn--primary" id="save-png-m" type="button">PNG 저장</button>
  <button class="btn btn--ghost" id="save-jpg-m" type="button">JPG 저장</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="app.js"></script>
</body>
</html>
